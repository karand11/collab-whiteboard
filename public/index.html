<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collab Whiteboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <strong>Collab Whiteboard</strong>
    </div>

    <div class="tools" role="toolbar" aria-label="Drawing tools">
      <div class="swatches" id="swatches" role="group" aria-label="Colors">
        <button type="button" class="swatch" data-color="#0f172a" style="--c:#0f172a" aria-label="Black"></button>
        <button type="button" class="swatch" data-color="#ef4444" style="--c:#ef4444" aria-label="Red"></button>
        <button type="button" class="swatch" data-color="#f59e0b" style="--c:#f59e0b" aria-label="Orange"></button>
        <button type="button" class="swatch" data-color="#22c55e" style="--c:#22c55e" aria-label="Green"></button>
        <button type="button" class="swatch" data-color="#2563eb" style="--c:#2563eb" aria-label="Blue"></button>
        <button type="button" class="swatch" data-color="#a855f7" style="--c:#a855f7" aria-label="Purple"></button>
        <button type="button" class="swatch eraser" data-color="#ffffff" aria-label="Eraser" title="Eraser"></button>
        <input id="color" type="color" value="#2563eb" aria-label="Custom color" title="Custom color">
      </div>
      <span class="divider"></span>
      <label class="size">
        <span class="sr">Pen size</span>
        <input id="size" type="range" min="1" max="40" value="4">
        <span id="dot" class="dot" aria-hidden="true"></span>
      </label>
    </div>

    <div class="actions">
      <span id="status" class="status" role="status" aria-live="polite">Connecting…</span>
      <button id="clear" type="button">Clear</button>
      <button id="share" type="button" class="primary">Copy link</button>
    </div>
  </header>

  <main id="board">
    <canvas id="canvas" width="1600" height="900" aria-label="Shared drawing canvas"></canvas>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
